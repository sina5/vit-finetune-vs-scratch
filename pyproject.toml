[project]
name = "vit-finetune-vs-scratch"
version = "0.1.0"
description = "ViT-B/16 on Flowers-102: from scratch, linear probe and LoRA."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "timm>=1.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitfinetune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120
